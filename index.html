<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>LEGEND ULTIMATE ARCADE (PC & MOBILE)</title>
    <style>
        /* Главные настройки интерфейса */
        body {
            background-color: #0b0b10;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        /* ИНТЕРАКТИВНЫЙ ЗАДНИЙ ФОН: ВОЛНЫ */
        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Тот самый плавный кружок за мышкой (теперь поверх всего) */
        .cursor-follower {
            width: 35px;
            height: 35px;
            border: 2px solid #00ffff;
            border-radius: 50%;
            position: absolute;
            transform: translate(-50%, -50%);
            pointer-events: none; /* Мышь кликает СКВОЗЬ круг */
            z-index: 9999; /* Самый высокий приоритет */
            box-shadow: 0 0 15px #00ffff, inset 0 0 15px #00ffff;
            animation: colorChange 4s infinite linear;
            left: -100px;
            top: -100px;
        }

        /* Главный контейнер (сближенные элементы игры и магазина) */
        .main-container {
            display: flex;
            gap: 20px;
            align-items: center;
            justify-content: center;
            z-index: 10;
            position: relative;
        }

        .game-section {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #00ff88;
            font-size: 32px;
            margin: 0 0 5px 0;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
        }

        .author-tag {
            color: #ff0055;
            font-weight: bold;
            font-size: 12px;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(255, 0, 85, 0.4);
        }

        .info-p {
            color: #8a8ab0;
            margin: 0 0 10px 0;
            font-size: 13px;
        }

        /* Динамическое игровое поле */
        #game-board {
            border: 4px solid #ff0055;
            background-color: #12121a;
            box-shadow: 0 0 30px rgba(255, 0, 85, 0.3);
            border-radius: 10px;
            transition: width 0.5s ease, height 0.5s ease;
        }

        .start-btn {
            background-color: #ff0055;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            margin-top: 10px;
            transition: 0.2s;
            z-index: 20;
        }

        .start-btn:hover { background-color: #ff3377; transform: scale(1.05); }

        /* ПАНЕЛЬ СКИНОВ И МАГАЗИНА */
        .shop-container {
            width: 280px;
            height: 485px;
            background-color: #12121a;
            border: 4px solid #00ffff;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.2);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .shop-header {
            background-color: #1a1a26;
            color: #00ffff;
            padding: 10px;
            font-weight: bold;
            text-align: center;
            border-bottom: 2px solid #00ffff;
        }

        .shop-balance {
            color: #00ff88;
            font-size: 13px;
            margin-top: 5px;
            display: block;
        }

        .shop-items {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .shop-category {
            font-size: 11px;
            color: #505055;
            border-bottom: 1px solid #222;
            padding-bottom: 3px;
            margin-top: 5px;
        }

        .skin-btn {
            background: #1f1f30;
            border: 2px solid #444;
            color: white;
            padding: 8px;
            cursor: pointer;
            border-radius: 5px;
            text-align: left;
            transition: 0.2s;
            display: flex;
            align-items: center;
        }
        .skin-btn:hover { border-color: #00ff88; }
        .skin-btn.active { border-color: #ff0055; background: #2a2a40; }
        .skin-preview { width: 15px; height: 15px; border-radius: 2px; margin-right: 10px; }

        .buy-btn {
            background: #ff0055;
            border: none;
            color: white;
            padding: 8px;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.2s;
        }
        .buy-btn:hover { background: #ff3377; }
        .buy-btn.bought { background: #505055; cursor: not-allowed; }
        .buy-btn .cost { color: #00ff88; font-size: 11px; }

        /* === 📲 МОБИЛЬНЫЙ ГЕЙМПАД: КНОПКИ УПРАВЛЕНИЯ 📲 === */
        #mobile-gamepad {
            display: flex; /* Показываем на всех экранах (на ПК не мешает) */
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: 100%;
            max-width: 400px;
            margin-top: 15px;
            z-index: 100;
        }

        .gamepad-row {
            display: flex;
            gap: 10px;
            width: 100%;
            justify-content: center;
        }

        .control-btn {
            background: #12121a;
            border: 3px solid #ff0055;
            color: #ff0055;
            font-size: 24px;
            font-weight: bold;
            padding: 15px;
            width: 70px;
            height: 70px;
            border-radius: 15px;
            cursor: pointer;
            transition: 0.1s;
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none; /* Не выделять текст */
        }

        .control-btn:active {
            transform: scale(0.9);
            background: rgba(255, 0, 85, 0.2);
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.6);
        }

        /* Кнопка ПАУЗА в мобильном меню */
        #mobile-pause-btn {
            border-color: #00ffff;
            color: #00ffff;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.4);
            font-size: 16px;
        }
        #mobile-pause-btn:active { background: rgba(0, 255, 255, 0.2); }

        /* Показываем геймпад только на узких (мобильных) экранах */
        @media (min-width: 800px) {
            #mobile-gamepad { display: none; } /* Скрываем на ПК */
        }

        @keyframes colorChange {
            0% { border-color: #00ffff; box-shadow: 0 0 15px #00ffff; }
            33% { border-color: #ff00ff; box-shadow: 0 0 15px #ff00ff; }
            66% { border-color: #ffff00; box-shadow: 0 0 15px #ffff00; }
            100% { border-color: #00ffff; box-shadow: 0 0 15px #00ffff; }
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>
    <div class="cursor-follower" id="follower"></div>

    <div class="main-container">

        <div class="game-section">
            <h1>LEGEND ARCADE</h1>
            <div class="author-tag">EVOLUTION MAPS</div>
            <p class="info-p">Счёт: <span id="score">0</span> | Рекорд: <span id="high-score">0</span> | Поле: <span id="map-level" style="color: #00ffff; font-weight: bold;">Малое</span></p>

            <canvas id="game-board" width="300" height="300"></canvas>

            <button class="start-btn" onclick="startGame()">ЗАПУСТИТЬ КАТКУ</button>

            <div id="mobile-gamepad">
                <div class="gamepad-row">
                    <button class="control-btn" ontouchstart="mobileInput('ArrowUp')">▲</button>
                </div>
                <div class="gamepad-row">
                    <button class="control-btn" ontouchstart="mobileInput('ArrowLeft')">◀</button>
                    <button class="control-btn" id="mobile-pause-btn" ontouchstart="mobileInput('Pause')">Pause</button>
                    <button class="control-btn" ontouchstart="mobileInput('ArrowRight')">▶</button>
                </div>
                <div class="gamepad-row">
                    <button class="control-btn" ontouchstart="mobileInput('ArrowDown')">▼</button>
                </div>
            </div>
        </div>

        <div class="shop-container">
            <div class="shop-header">
                LEGEND MAINFRAME
                <span class="shop-balance">Монеты LEGEND: <span id="coins">0</span></span>
            </div>
            
            <div class="shop-items">
                <div class="shop-category">Твои скины (Бесплатно)</div>
                <button class="skin-btn active" onclick="setSkin('neon')"><div class="skin-preview" style="background:#00ff88;"></div> Классический Неон</button>
                <button class="skin-btn" onclick="setSkin('gold')"><div class="skin-preview" style="background:#ffff00; box-shadow:0 0 10px #ffff00;"></div> Золотая Легенда</button>
                <button class="skin-btn" onclick="setSkin('rainbow')"><div class="skin-preview" style="background:linear-gradient(45deg, #ff0055, #00ffff);"></div> Кибер-Радуга</button>

                <div class="shop-category">Магазин Улучшений (За очки)</div>
                <button class="buy-btn" id="buy-portals" onclick="buyFeature('portals', 1000)">
                    Режим «Сквозь стены» (Порталы) <span class="cost">🛒 1000 LEGEND</span>
                </button>
                <button class="buy-btn" id="buy-slow" onclick="buyFeature('slow', 300)">
                    Супер-Замедление (на 1 live) <span class="cost">🛒 300 LEGEND</span>
                </button>
            </div>
        </div>

    </div>

    <script>
        // === 🌀 ИНТЕРАКТИВНЫЙ ФОН (ТЕПЕРЬ НА ВСЁ ОКНО) 🌀 ===
        const bgCanvas = document.getElementById('bg-canvas');
        const bgCtx = bgCanvas.getContext('2d');
        const follower = document.getElementById('follower');
        
        bgCanvas.width = window.innerWidth;
        bgCanvas.height = window.innerHeight;
        let ripples = [];

        // Пересчет экрана при изменении окна
        window.addEventListener('resize', () => {
            bgCanvas.width = window.innerWidth;
            bgCanvas.height = window.innerHeight;
        });

        // Слушаем движение мыши ПО ВСЕМУ окну
        window.addEventListener('mousemove', (e) => {
            ripples.push({
                x: e.clientX,
                y: e.clientY,
                radius: 2,
                opacity: 0.7,
                color: getComputedStyle(follower).borderColor
            });
            follower.style.left = e.clientX + 'px';
            follower.style.top = e.clientY + 'px';
        });

        function drawBackground() {
            bgCtx.fillStyle = '#0b0b10';
            bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);
            for (let i = ripples.length - 1; i >= 0; i--) {
                const r = ripples[i];
                bgCtx.beginPath();
                bgCtx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
                bgCtx.strokeStyle = `${r.color.replace('rgb', 'rgba').replace(')', `, ${r.opacity})`)}`;
                bgCtx.lineWidth = 2;
                bgCtx.stroke();
                r.radius += 2.5; r.opacity -= 0.015;
                if (r.opacity <= 0) { ripples.splice(i, 1); }
            }
            requestAnimationFrame(drawBackground);
        }
        drawBackground();

        // === 🔊 ЗВУКИ 🔊 ===
        const snd = {
            eat: new Audio('https://cdn.pixabay.com/audio/2022/03/15/audio_145d554a9d.mp3'),
            over: new Audio('https://cdn.pixabay.com/audio/2023/10/01/audio_db6f7b1d9c.mp3'),
            gold: new Audio('https://cdn.pixabay.com/audio/2022/03/19/audio_6e9167c699.mp3'),
            buy: new Audio('https://cdn.pixabay.com/audio/2022/03/13/audio_097f48e9f5.mp3'),
            levelup: new Audio('https://cdn.pixabay.com/audio/2024/02/12/audio_12a3bc4d5e.mp3'),
            click: new Audio('https://cdn.pixabay.com/audio/2022/03/15/audio_73ac97b5e0.mp3') // Клик кнопок
        };
        snd.eat.volume = 0.5; snd.over.volume = 0.6; snd.gold.volume = 0.7; snd.click.volume = 0.2;

        // === 🎮 КОД ИГРЫ ЗМЕЙКА (ДИНАМИЧЕСКИЕ РАЗМЕРЫ) 🎮 ===
        const canvas = document.getElementById('game-board');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const highScoreElement = document.getElementById('high-score');
        const coinsElement = document.getElementById('coins');
        const mapLevelElement = document.getElementById('map-level');

        const gridSize = 20;
        
        let snake = [];
        let food = { x: 5, y: 5 };
        let goldFood = null;
        let goldFoodTimer = null;
        let dx = gridSize;
        let dy = 0;
        let score = 0;
        let gameInterval = null;
        let isPaused = false;
        let isPlaying = false;

        let highScore = localStorage.getItem('snake_high_score') || 0;
        let totalCoins = localStorage.getItem('snake_coins') || 0;
        let featurePortals = localStorage.getItem('snake_portals') === 'true';
        let speedModifier = 100;
        let currentSpeed = 100;

        highScoreElement.innerText = highScore;
        coinsElement.innerText = totalCoins;
        
        if(featurePortals) { 
            document.getElementById('buy-portals').classList.add('bought'); 
            document.getElementById('buy-portals').innerText = 'Режим «Порталы» Активен!'; 
        }

        resizeBoard(300, 300);
        showMenuText('Нажми кнопку для старта');

        function resizeBoard(w, h) {
            canvas.width = w;
            canvas.height = h;
        }

        function showMenuText(text) {
            ctx.fillStyle = '#12121a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#8a8ab0';
            ctx.font = '16px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(text, canvas.width / 2, canvas.height / 2);
        }

        function startGame() {
            resizeBoard(300, 300);
            mapLevelElement.innerText = "Малое";
            mapLevelElement.style.color = "#00ffff";

            snake = [{ x: 100, y: 100 }, { x: 80, y: 100 }, { x: 60, y: 100 }];
            dx = gridSize; dy = 0; score = 0;
            goldFood = null; if(goldFoodTimer) clearTimeout(goldFoodTimer);
            scoreElement.innerText = score;
            resetFood();
            
            isPaused = false;
            isPlaying = true;
            currentSpeed = speedModifier;
            speedModifier = 100;

            if(gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(updateGame, currentSpeed);
        }

        function togglePause() {
            if (!isPlaying) return;

            if (!isPaused) {
                isPaused = true;
                clearInterval(gameInterval);
                ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#00ffff';
                ctx.font = '30px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('ПАУЗА', canvas.width / 2, canvas.height / 2);
                document.getElementById('mobile-pause-btn').innerText = "Play"; // Меняем текст кнопки
            } else {
                isPaused = false;
                gameInterval = setInterval(updateGame, currentSpeed);
                document.getElementById('mobile-pause-btn').innerText = "Pause"; // Вернуть Pause
            }
        }

        function updateGame() {
            if (isPaused) return;

            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            
            if (featurePortals) {
                if (head.x < 0) head.x = canvas.width - gridSize;
                if (head.x >= canvas.width) head.x = 0;
                if (head.y < 0) head.y = canvas.height - gridSize;
                if (head.y >= canvas.height) head.y = 0;
            } else if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
                endGame(); return;
            }

            if (collision(head)) { endGame(); return; }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.innerText = score;
                snd.eat.cloneNode(true).play();
                resetFood();
                checkGoldSpawn();
                checkMapEvolution();
            } 
            else if (goldFood && head.x === goldFood.x && head.y === goldFood.y) {
                score += 100;
                scoreElement.innerText = score;
                snd.gold.play();
                goldFood = null;
                clearTimeout(goldFoodTimer);
                checkMapEvolution();
            }
            else {
                snake.pop();
            }

            drawGame();
        }

        function checkMapEvolution() {
            if (score >= 150 && canvas.width === 300) {
                try { snd.levelup.play(); } catch(e){}
                resizeBoard(440, 440);
                mapLevelElement.innerText = "Среднее";
                mapLevelElement.style.color = "#ffff00";
                resetFood();
            }
            else if (score >= 350 && canvas.width === 440) {
                try { snd.levelup.play(); } catch(e){}
                resizeBoard(600, 600);
                mapLevelElement.innerText = "Грандиозное!";
                mapLevelElement.style.color = "#ff0055";
                resetFood();
            }
        }

        function drawGame() {
            if (isPaused) return;
            ctx.fillStyle = '#12121a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#ff0055';
            ctx.fillRect(food.x, food.y, gridSize - 2, gridSize - 2);

            if (goldFood) {
                ctx.fillStyle = (Date.now() % 500 < 250) ? '#ffff00' : '#ffa500';
                ctx.shadowBlur = 15; ctx.shadowColor = '#ffff00';
                ctx.fillRect(goldFood.x, goldFood.y, gridSize - 2, gridSize - 2);
                ctx.shadowBlur = 0;
            }

            drawSnakeSkin();
        }

        function collision(head) {
            return snake.some((part, index) => index !== 0 && part.x === head.x && part.y === head.y);
        }

        function resetFood() {
            const tileCountX = canvas.width / gridSize;
            const tileCountY = canvas.height / gridSize;
            food.x = Math.floor(Math.random() * (tileCountX - 4) + 2) * gridSize;
            food.y = Math.floor(Math.random() * (tileCountY - 4) + 2) * gridSize;
        }

        function checkGoldSpawn() {
            if (!goldFood && Math.random() < 0.2) {
                const tileCountX = canvas.width / gridSize;
                const tileCountY = canvas.height / gridSize;
                goldFood = {
                    x: Math.floor(Math.random() * (tileCountX - 4) + 2) * gridSize,
                    y: Math.floor(Math.random() * (tileCountY - 4) + 2) * gridSize
                };
                try { snd.gold.play(); } catch(e){}
                goldFoodTimer = setTimeout(() => { goldFood = null; }, 7000);
            }
        }

        function endGame() {
            isPlaying = false;
            clearInterval(gameInterval);
            try { snd.over.play(); } catch(e){}
            
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#ff0055';
            ctx.font = '24px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('ИГРА ОКОНЧЕНА', canvas.width / 2, canvas.height / 2);
            
            addCoins(score);
            
            if (score > highScore) {
                highScore = score;
                highScoreElement.innerText = highScore;
                localStorage.setItem('snake_high_score', highScore);
            }
        }

        function addCoins(amount) {
            totalCoins = parseInt(totalCoins) + amount;
            coinsElement.innerText = totalCoins;
            localStorage.setItem('snake_coins', totalCoins);
        }

        function buyFeature(feature, cost) {
            if (feature === 'portals' && featurePortals) return;
            if (totalCoins >= cost) {
                addCoins(-cost);
                try { snd.buy.play(); } catch(e){}
                if (feature === 'portals') {
                    featurePortals = true;
                    localStorage.setItem('snake_portals', 'true');
                    document.getElementById('buy-portals').classList.add('bought');
                    document.getElementById('buy-portals').innerText = 'Режим «Порталы» Активен!';
                } else if (feature === 'slow') {
                    speedModifier = 200;
                    if(isPlaying) {
                        currentSpeed = 200;
                        clearInterval(gameInterval);
                        gameInterval = setInterval(updateGame, currentSpeed);
                    }
                    document.getElementById('buy-slow').innerText = 'Замедление Куплено (на 1 life)';
                    setTimeout(() => { document.getElementById('buy-slow').innerText = 'Супер-Замедление (на 1 life) 🛒 300 LEGEND' }, 3000)
                }
            } else {
                alert("Маловато монет, Легенда!");
            }
        }

        let currentSkin = localStorage.getItem('snake_skin') || 'neon';
        document.querySelectorAll('.skin-btn').forEach(btn => btn.classList.remove('active'));
        const activeBtn = document.querySelector(`.skin-btn[onclick="setSkin('${currentSkin}')"]`);
        if(activeBtn) activeBtn.classList.add('active');

        function setSkin(skin) {
            if (skin === currentSkin) return;
            currentSkin = skin;
            localStorage.setItem('snake_skin', currentSkin);
            try { snd.buy.cloneNode(true).play(); } catch(e){}
            document.querySelectorAll('.skin-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`.skin-btn[onclick="setSkin('${skin}')"]`).classList.add('active');
            if(isPlaying && !isPaused) drawGame();
        }

        function drawSnakeSkin() {
            snake.forEach((part, index) => {
                if (currentSkin === 'neon') {
                    ctx.fillStyle = index === 0 ? '#33ffaa' : '#00ff88';
                    ctx.shadowBlur = 10; ctx.shadowColor = '#00ff88';
                }
                else if (currentSkin === 'gold') {
                    ctx.fillStyle = '#ffff00';
                    ctx.shadowBlur = 15; ctx.shadowColor = '#ffff00';
                }
                else if (currentSkin === 'rainbow') {
                    ctx.fillStyle = `hsl(${(Date.now() / 10 + index * 15) % 360}, 100%, 60%)`;
                    ctx.shadowBlur = 10; ctx.shadowColor = ctx.fillStyle;
                }
                ctx.fillRect(part.x, part.y, gridSize - 2, gridSize - 2);
                ctx.shadowBlur = 0;
            });
        }

        // === 📲 ЛОГИКА УПРАВЛЕНИЯ (ПК И ТЕЛЕФОН) 📲 ===
        
        // 1. Код для сенсорных кнопок на экране
        function mobileInput(dir) {
            if (!isPlaying) return;
            
            snd.click.cloneNode(true).play(); // Звук клика

            if (dir === 'Pause') {
                togglePause();
                return;
            }

            if (isPaused) return; // На паузе рулить нельзя

            // Логика поворота (запрет разворота на 180)
            if (dir === 'ArrowUp' && dy === 0) { dx = 0; dy = -gridSize; }
            else if (dir === 'ArrowDown' && dy === 0) { dx = 0; dy = gridSize; }
            else if (dir === 'ArrowLeft' && dx === 0) { dx = -gridSize; dy = 0; }
            else if (dir === 'ArrowRight' && dx === 0) { dx = gridSize; dy = 0; }
        }

        // 2. Код для клавиш на ПК
        document.addEventListener('keydown', (e) => {
            if (e.key === ' ' || e.code === 'Space') {
                e.preventDefault(); // Запрет скролла
                togglePause();
            }

            if (isPaused) return;

            if (e.key === 'ArrowUp' && dy === 0) { dx = 0; dy = -gridSize; }
            if (e.key === 'ArrowDown' && dy === 0) { dx = 0; dy = gridSize; }
            if (e.key === 'ArrowLeft' && dx === 0) { dx = -gridSize; dy = 0; }
            if (e.key === 'ArrowRight' && dx === 0) { dx = gridSize; dy = 0; }
        });
    </script>
</body>
</html>
